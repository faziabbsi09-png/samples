name: Flutter Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Yeh version purane Gradle scripts ko block nahi karta
          channel: 'stable'

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get
        working-directory: material_3_demo

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: material_3_demo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-chat-apk
          path: material_3_demo/build/app/outputs/flutter-apk/app-release.apk
