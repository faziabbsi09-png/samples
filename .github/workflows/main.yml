name: Flutter Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Naye Flutter ke liye Java 17 zaroori hai
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get
        working-directory: material_3_demo

      - name: Build APK (Force Gradle)
        run: |
          # Agar purana Gradle issue ho to ye fix karega
          flutter build apk --release --target-platform android-arm64
        working-directory: material_3_demo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-chat-apk
          path: material_3_demo/build/app/outputs/flutter-apk/app-release.apk
